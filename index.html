<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster | 英文單字測試</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        <header>
            <h1>Vocab<span>Master</span></h1>
            <p>提升你的詞彙量</p>
        </header>

        <section class="test-card" id="testCard">
            <div id="filePickerArea" style="display: none; margin-bottom: 2rem; text-align: center; border: 1px dashed var(--glass-border); padding: 1.5rem; border-radius: 16px;">
                <p style="font-size: 0.85rem; margin-bottom: 1rem; color: var(--text-muted);">瀏覽器安全限制，請手動選取您想測試的 .csv 檔案，或使用本機伺服器 (Localhost) 來開啟網頁：</p>
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                <button onclick="document.getElementById('csvFileInput').click()" class="secondary-btn" style="width: 100%;">選取單字檔案</button>
            </div>

            <div class="category-selection" id="categorySelectionArea" style="margin-bottom: 1rem;">
                <label for="categorySelect">選擇類別:</label>
                <select id="categorySelect" class="styled-select">
                    <option value="words.csv">常用會話</option>
                    <option value="Animals.csv">動物</option>
                    <option value="Foods.csv">食物</option>
                    <option value="Fruits.csv">水果</option>
                    <option value="Furniture.csv">家具</option>
                    <option value="Insects.csv">昆蟲</option>
                    <option value="Kitchenware.csv">餐具與廚具</option>
                    <option value="Organs.csv">器官</option>
                    <option value="Sports.csv">運動</option>
                    <option value="Vegetables.csv">蔬菜</option>
                    <option value="Vehicles.csv">交通工具</option>
                </select>
            </div>

            <div class="group-selection" id="groupSelectionArea" style="margin-bottom: 1.5rem;">
                <label for="groupSelect">選擇組別 (每 20 字一組):</label>
                <select id="groupSelect" class="styled-select">
                    <option value="-1">載入中...</option>
                </select>
            </div>

            <div class="stats">
                <span id="scoreDisplay">得分: 0</span>
                <span id="totalDisplay">完成: 0</span>
            </div>

            <div class="word-display">
                <h2 id="chineseWord">載入中...</h2>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="englishInput" placeholder="輸入英文單字..." autocomplete="off">
                    <button id="speakBtn" class="speaker-btn" title="發音">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                </div>
                <button id="checkBtn">確認結果</button>
            </div>

            <div id="feedback" class="feedback"></div>

            <div class="controls">
                <button id="nextBtn" class="secondary-btn">下一個</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
